<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Signal Lost</title>
<style>
  html, body { margin: 0; height: 100%; background: #050506; overflow: hidden; font-family: system-ui, "Segoe UI", sans-serif; }
  canvas { display: block; width: 100vw; height: 100vh; touch-action: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
/* SIGNAL LOST — a scout drone threads an unmapped tunnel. Hold to climb, release to fall. */
(function () {
  var cv = document.getElementById('c'), g = cv.getContext('2d');
  var W, H, dpr;
  function resize() { dpr = Math.min(2, window.devicePixelRatio || 1); W = innerWidth; H = innerHeight; cv.width = W * dpr; cv.height = H * dpr; g.setTransform(dpr, 0, 0, dpr, 0, 0); }
  addEventListener('resize', resize); resize();

  var best = Number(localStorage.getItem('signal-lost-best') || 0);
  var state = 'title', hold = false, t = 0, dist = 0, speed, drone, cave, sparks, trail, seed;
  function rnd() { seed = (seed * 16807) % 2147483647; return (seed - 1) / 2147483646; }
  function reset() {
    seed = 1 + Math.floor(Math.random() * 1e6); speed = 260; dist = 0; t = 0;
    drone = { y: H * 0.5, vy: 0 }; sparks = []; trail = [];
    cave = []; var c = H * 0.5, gap = H * 0.62;
    for (var x = 0; x <= W + 40; x += 20) cave.push({ x: x, top: c - gap / 2, bot: c + gap / 2, pillar: null });
  }
  function extend() {
    var last = cave[cave.length - 1];
    var gap = Math.max(H * 0.26, H * 0.62 - dist * 0.012);
    var c = Math.max(gap / 2 + 20, Math.min(H - gap / 2 - 20, (last.top + last.bot) / 2 + (rnd() - 0.5) * 60));
    var seg = { x: last.x + 20, top: c - gap / 2, bot: c + gap / 2, pillar: null };
    if (rnd() < 0.035 && dist > 400) { var ph = gap * 0.32; seg.pillar = { y: seg.top + rnd() * (gap - ph), h: ph }; }
    cave.push(seg);
  }
  function crash() {
    state = 'dead';
    for (var i = 0; i < 60; i++) { var a = Math.random() * 6.28, s = 50 + Math.random() * 300; sparks.push({ x: W * 0.25, y: drone.y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, t: 1 }); }
    var score = Math.floor(dist / 10);
    if (score > best) { best = score; localStorage.setItem('signal-lost-best', String(best)); }
  }
  function press(v) {
    hold = v;
    if (v && state !== 'play') { if (state === 'dead' && sparks.length > 20) return; reset(); state = 'play'; }
  }
  addEventListener('keydown', function (e) { if (e.key === ' ' || e.key === 'ArrowUp' || e.key === 'Enter') { e.preventDefault(); if (!e.repeat) press(true); } });
  addEventListener('keyup', function (e) { if (e.key === ' ' || e.key === 'ArrowUp' || e.key === 'Enter') press(false); });
  cv.addEventListener('pointerdown', function () { press(true); });
  addEventListener('pointerup', function () { press(false); });

  var last = 0;
  function frame(now) {
    var dt = Math.min(0.033, (now - last) / 1000 || 0); last = now; t += dt;
    if (state === 'play') {
      speed += dt * 6; dist += speed * dt;
      drone.vy += (hold ? -900 : 700) * dt; drone.vy = Math.max(-420, Math.min(480, drone.vy)); drone.y += drone.vy * dt;
      cave.forEach(function (s) { s.x -= speed * dt; });
      while (cave.length && cave[0].x < -40) cave.shift();
      while (cave[cave.length - 1].x < W + 40) extend();
      trail.push({ x: W * 0.25, y: drone.y }); trail.forEach(function (p) { p.x -= speed * dt; }); if (trail.length > 40) trail.shift();
      var dx = W * 0.25;
      for (var i = 0; i < cave.length; i++) {
        var s = cave[i];
        if (Math.abs(s.x - dx) < 14) {
          if (drone.y - 7 < s.top || drone.y + 7 > s.bot) { crash(); break; }
          if (s.pillar && drone.y + 7 > s.pillar.y && drone.y - 7 < s.pillar.y + s.pillar.h) { crash(); break; }
        }
      }
    }
    sparks.forEach(function (p) { p.x += p.vx * dt; p.y += p.vy * dt; p.vy += 400 * dt; p.t -= dt * 0.8; });
    sparks = (sparks || []).filter(function (p) { return p.t > 0; });
    draw();
    requestAnimationFrame(frame);
  }
  function draw() {
    g.fillStyle = '#050506'; g.fillRect(0, 0, W, H);
    if (!cave) { reset(); }
    g.fillStyle = '#121317'; g.strokeStyle = '#c8102e'; g.lineWidth = 2;
    g.beginPath(); g.moveTo(cave[0].x, 0); cave.forEach(function (s) { g.lineTo(s.x, s.top); }); g.lineTo(cave[cave.length - 1].x, 0); g.closePath(); g.fill();
    g.beginPath(); cave.forEach(function (s, i) { i ? g.lineTo(s.x, s.top) : g.moveTo(s.x, s.top); }); g.stroke();
    g.beginPath(); g.moveTo(cave[0].x, H); cave.forEach(function (s) { g.lineTo(s.x, s.bot); }); g.lineTo(cave[cave.length - 1].x, H); g.closePath(); g.fill();
    g.beginPath(); cave.forEach(function (s, i) { i ? g.lineTo(s.x, s.bot) : g.moveTo(s.x, s.bot); }); g.stroke();
    cave.forEach(function (s) { if (s.pillar) { g.fillStyle = '#26292e'; g.fillRect(s.x - 8, s.pillar.y, 16, s.pillar.h); g.fillStyle = '#ff2b3f'; g.fillRect(s.x - 8, s.pillar.y, 16, 2); g.fillRect(s.x - 8, s.pillar.y + s.pillar.h - 2, 16, 2); } });
    trail.forEach(function (p, i) { g.fillStyle = 'rgba(255,43,63,' + (i / trail.length * 0.5) + ')'; g.fillRect(p.x - 2, p.y - 2, 4, 4); });
    if (state !== 'dead' || sparks.length > 40) {
      var x = W * 0.25, y = drone ? drone.y : H / 2;
      g.save(); g.translate(x, y); g.rotate(drone ? Math.max(-0.5, Math.min(0.5, drone.vy / 900)) : 0);
      g.fillStyle = '#c9ced6'; g.fillRect(-14, -6, 28, 12);
      g.fillStyle = '#ff2b3f'; g.shadowColor = '#ff2b3f'; g.shadowBlur = 14; g.fillRect(4, -3, 7, 6); g.shadowBlur = 0;
      g.restore();
    }
    sparks.forEach(function (p) { g.globalAlpha = Math.max(0, p.t); g.fillStyle = '#ff8a94'; g.fillRect(p.x, p.y, 3, 3); }); g.globalAlpha = 1;
    g.fillStyle = '#dfe3e8'; g.font = '600 16px system-ui, sans-serif';
    g.fillText('DISTANCE ' + Math.floor(dist / 10), 20, 30); g.fillStyle = '#8b929c'; g.fillText('BEST ' + best, 20, 52);
    if (state !== 'play') {
      g.textAlign = 'center'; g.fillStyle = '#f4f6f8'; g.font = '800 ' + Math.min(72, W / 10) + 'px system-ui, sans-serif';
      g.fillText(state === 'dead' ? 'SIGNAL LOST' : 'SIGNAL LOST', W / 2, H * 0.42);
      g.font = '500 18px system-ui, sans-serif'; g.fillStyle = '#ff5a66';
      g.fillText(state === 'dead' ? 'Drone destroyed at ' + Math.floor(dist / 10) + '. Hold Space, click or tap to relaunch.' : 'Hold Space, click or tap to climb. Release to fall.', W / 2, H * 0.42 + 40);
      g.textAlign = 'left';
    }
  }
  reset(); state = 'title';
  window.__SL_READY = true;
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
